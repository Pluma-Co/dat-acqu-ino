<!doctype html>
<html>

<head>
    <title>Graphics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
</head>

<body>

    <h1>Monitoramento Bruto (Tempo Real)</h1>
    <div style="display: flex;justify-content: space-between;">
        <div style="width: 32%;">
            <canvas id="sensorBiodigestor"></canvas>
        </div>
        <div style="width: 32%;">
            <canvas id="sensorPurificacao"></canvas>
        </div>
        <div style="width: 32%;">
            <canvas id="sensorCompressor"></canvas>
        </div>
    </div>

    <script>
        // delimitação de vazamentos
        const configuracaoEixoY = {
            title: {
                display: true,
                text: 'PPM (Partes por Milhão)'
            },
            beginAtZero: true,
            min: 0,
            max: 10000, // Limite estabelecido para o sensor MQ-4
            ticks: {
                stepSize: 2000
            }
        };
        // CRIAR DATASETS   
        function criarDatasets(nomeSensor, corSensor) {
            return [
                {
                    label: nomeSensor,
                    borderColor: corSensor,
                    backgroundColor: corSensor,
                    data: []
                },
                {
                    label: 'Leve (2000)',
                    borderColor: '#28A745', // Linha Verde
                    backgroundColor: '#28A745', // legenda verde 
                    pointRadius: 0,
                    data: []
                },
                {
                    label: 'Moderado (6000)',
                    borderColor: '#FFC107', // Linha amarela
                    backgroundColor: '#FFC107', // legenda amarela
                    pointRadius: 0,
                    data: []
                },
                {
                    label: 'Crítico (10000)',
                    borderColor: '#DC3545', // linha vermelha
                    backgroundColor: '#DC3545', // legenda vermelha 
                    pointRadius: 0,
                    data: []
                }
            ];
        }

        // os 3 graficos 
        var chartBiodigestor = new Chart(document.getElementById('sensorBiodigestor').getContext('2d'), {
            type: 'line',
            data: {datasets: criarDatasets('Biodigestor', '#ED145B')},
            options: {scales: {y: configuracaoEixoY}}
        });

        var chartPurificacao = new Chart(document.getElementById('sensorPurificacao').getContext('2d'), {
            type: 'line',
            data: {datasets: criarDatasets('Purificação', '#0762C8')},
            options: {scales: {y: configuracaoEixoY}}
        });

        var chartCompressor = new Chart(document.getElementById('sensorCompressor').getContext('2d'), {
            type: 'line',
            data: {datasets: criarDatasets('Compressor', '#28A745')},
            options: {scales: {y: configuracaoEixoY}}
        });

        var paginacao = {};
        var tempo = {};

        function obterDados(grafico, endpoint) {
            fetch('http://localhost:3300/sensores/' + endpoint)
                .then(response => response.json())
                .then(valores => {
                    if (paginacao[endpoint] == null) {
                        paginacao[endpoint] = 0;
                    }
                    if (tempo[endpoint] == null) {
                        tempo[endpoint] = 0;
                    }

                    var ultimaPaginacao = paginacao[endpoint];
                    paginacao[endpoint] = valores.length;
                    valores = valores.slice(ultimaPaginacao);

                    valores.forEach((valor) => {
                        if (grafico.data.labels.length == 10 ) {
                            grafico.data.labels.shift();
                            grafico.data.datasets[0].data.shift();
                            grafico.data.datasets[1].data.shift();
                            grafico.data.datasets[2].data.shift();
                            grafico.data.datasets[3].data.shift();
                        }

                        grafico.data.labels.push(tempo[endpoint]++);
                        grafico.data.datasets[0].data.push(parseFloat(valor));
                        grafico.data.datasets[1].data.push(2000);
                        grafico.data.datasets[2].data.push(5000);
                        grafico.data.datasets[3].data.push(10000);
                        grafico.update();
                    });
                })
                .catch(error => console.error('Erro ao obter dados:', error));
        }

        setInterval(() => {
            obterDados(chartBiodigestor, 'biodigestor');
            obterDados(chartPurificacao, 'purificacao');
            obterDados(chartCompressor, 'compressor');
        }, 1000);

    </script>
</body>

</html>
